<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account | Northstar</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-layout"><a class="brand" href="/">NORTHSTAR <span>IDENTITY</span></a><section class="panel"><p class="eyebrow">Start securely</p><h1>Create account</h1><p class="muted">Your password must be 12+ characters with mixed case, a number, and a symbol.</p><form id="register-form"><label>Name<input name="displayName" autocomplete="name" maxlength="80" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" autocomplete="new-password" minlength="12" required></label><button class="button primary" type="submit">Create account</button><p class="form-message" aria-live="polite"></p></form><p class="switch">Already registered? <a href="/login.html">Sign in</a></p></section></main><script src="/app.js"></script></body></html>
